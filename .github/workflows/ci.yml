name: CI

# The vendor-agnostic merge gate. Every PR — whether authored by you, a Claude
# agent, or a Mistral Vibe agent — must pass this before it can merge to main.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no media or unguarded charts in git
        run: bash scripts/check-no-media.sh

      # midir's Linux backend links ALSA via alsa-sys; the headers aren't on
      # ubuntu-latest by default. (No-op on the Windows build path.)
      - name: Install ALSA dev headers (for midir)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Tests
        run: cargo test --workspace --all-features
