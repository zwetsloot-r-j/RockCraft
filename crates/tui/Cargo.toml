[package]
name = "rockcraft-tui"
description = "Terminal frontend (MVP view layer). Swappable for Tauri/Godot later."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "rockcraft"
path = "src/main.rs"

[lib]
name = "rockcraft_tui"
path = "src/lib.rs"

[features]
# Optional visual-verification tier (M4-H).  Heavy image/font deps stay behind
# this flag so the default `cargo build`/`cargo test` remain unaffected.
screenshot = ["dep:image"]

[dependencies]
rockcraft-core.workspace = true
rockcraft-midi.workspace = true
rockcraft-audio.workspace = true
rockcraft-control.workspace = true
rockcraft-import.workspace = true
# Host-command tier (M8-A) builds JSON result payloads for `run_command`.
serde_json = { workspace = true }
ratatui = "0.29"
crossterm = "0.28"
# Channel types for the control seam plus a runtime to host the server thread.
# The render/MIDI loop stays sync — it only ever `try_recv`s the channel; the
# tokio runtime is confined to a dedicated server thread spawned in `main`.
tokio = { workspace = true }
# Optional screenshot deps (M4-H) — never pulled into the default build.
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[dev-dependencies]
rockcraft-core.workspace = true
rockcraft-midi.workspace = true
rockcraft-control.workspace = true
crossterm = "0.28"
tokio = { workspace = true }
serde_json = { workspace = true }

[[example]]
name = "screenshot"
required-features = ["screenshot"]
