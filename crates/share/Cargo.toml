[package]
name = "rockcraft-share"
description = "Song sharing: the .rcsong song archive (M26-A) and the LAN share server/client (M26-B)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rockcraft-core.workspace = true
rockcraft-midi.workspace = true
serde.workspace = true
serde_json.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# LAN share server (M26-B): its own tokio runtime thread, never the UI's.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "fs", "io-util", "sync", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util.workspace = true
# LAN share client: blocking, plain HTTP (no TLS) — home network only.
ureq = { version = "2", default-features = false }
# This machine's LAN addresses, for "sharing at 192.168.1.5:27800".
if-addrs = "0.15"
# Peer discovery (M26-C): pure-Rust mDNS/DNS-SD, no system daemon.
mdns-sd = "0.21"
# Archives in flight live in anonymous temp files (deleted on close).
tempfile = "3"
