[pytest]
testpaths = tests
python_files = test_*.py
# `-m "not omr"` is the default because OMR needs an engine and a real scan, and
# CI has neither by design. Run the manual check locally with `-m omr`.
addopts = -q -m "not omr"
markers =
    omr: needs a real OMR engine and a real scan — manual local check only
