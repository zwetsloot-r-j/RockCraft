[package]
name = "rockcraft-tauri"
description = "Tauri 2 desktop frontend (M2). Integration layer over rockcraft-core."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The library carries the app logic so the same `run()` can back both the
# desktop binary and future mobile entry points. The bin is a thin shim.
[lib]
name = "rockcraft_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rockcraft-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rockcraft-core = { workspace = true }
rockcraft-midi = { workspace = true }
rockcraft-audio = { workspace = true }
rockcraft-import = { workspace = true }
rockcraft-control = { workspace = true }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# Guarantees a single running instance: a second launch focuses the existing
# window instead of spawning a second WebView2 on the shared user-data dir
# (identifier `dev.rockcraft.app`). Two WebView2 environments contending over
# that dir + GPU surfaces was the on-our-side trigger for the compositor/driver
# instability that ended in an nvlddmkm bugcheck.
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
